name: iOS TestFlight

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      build_signed:
        description: Build and verify a signed IPA (requires Apple signing secrets)
        required: false
        type: boolean
        default: false
      upload_testflight:
        description: Upload the verified IPA to the internal TestFlight channel
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-testflight-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.6.1
  GODOT_EDITOR_SHA256: f43613ad72ab1cc9ef14383545f4de344844451a5c9c5f4ea4a923f1f34f91e4
  GODOT_TEMPLATES_SHA256: e6d372afd4fdfaae9571eb5e3568afcd96ce6db9a569244034154faf0ac69875
  IOS_PRESET: iOS
  IOS_BUNDLE_ID: com.theresiansquest.game
  IOS_TEAM_ID: 7A4H2D888M

jobs:
  export-ios:
    name: Export and verify iOS IPA
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify source, iOS preset, and production API
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f export_presets.cfg
          test -f Data/api_config.json
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$GITHUB_SHA" ]]; then
            echo "Checked-out commit does not match the triggering SHA." >&2
            exit 1
          fi
          python3 - "$IOS_BUNDLE_ID" "$IOS_TEAM_ID" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          expected_bundle, expected_team = sys.argv[1:]
          text = Path("export_presets.cfg").read_text(encoding="utf-8")
          ios = None
          for block in re.split(r"(?m)(?=^\[preset\.\d+\]\r?\n)", text):
              if 'name="iOS"' in block and 'platform="iOS"' in block:
                  ios = block
                  break
          if ios is None:
              raise SystemExit("The existing iOS export preset was not found.")
          checks = {
              'architectures/arm64=true': 'iOS preset must enable arm64.',
              f'application/app_store_team_id="{expected_team}"': 'iOS preset Team ID does not match the approved project Team ID.',
              f'application/bundle_identifier="{expected_bundle}"': 'iOS bundle identifier is not the expected existing ID.',
          }
          for needle, message in checks.items():
              if needle not in ios:
                  raise SystemExit(message)
          config = json.loads(Path("Data/api_config.json").read_text(encoding="utf-8"))
          if config.get("production_url") != "https://theresiansquest.com":
              raise SystemExit("The committed production API URL is not the approved URL.")
          print("iOS preset and production API URL verified.")
          print(f"Bundle ID: {expected_bundle}")
          print(f"Apple Team ID: {expected_team}")
          PY

      - name: Show Xcode toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcode-select -p
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Download, verify, and install official Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          godot_dir="$RUNNER_TEMP/godot-${GODOT_VERSION}"
          template_dir="$RUNNER_TEMP/godot-export-templates-${GODOT_VERSION}"
          if [[ -e "$godot_dir" || -e "$template_dir" ]]; then
            echo "Unexpected pre-existing Godot staging directory; refusing to reuse it." >&2
            exit 1
          fi
          mkdir -p "$godot_dir" "$template_dir"
          godot_zip="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          templates_tgz="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl --fail --location --retry 3 --silent --show-error --output "$godot_zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl --fail --location --retry 3 --silent --show-error --output "$templates_tgz" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          printf '%s  %s\n' "$GODOT_EDITOR_SHA256" "$godot_zip" | shasum -a 256 -c -
          printf '%s  %s\n' "$GODOT_TEMPLATES_SHA256" "$templates_tgz" | shasum -a 256 -c -
          unzip -tq "$godot_zip"
          unzip -tq "$templates_tgz"
          unzip -q "$godot_zip" -d "$godot_dir"
          godot_app="$(find "$godot_dir" -type d -name Godot.app -print -quit)"
          test -n "$godot_app"
          godot_bin="$godot_app/Contents/MacOS/Godot"
          test -x "$godot_bin"
          codesign --verify --deep --strict --verbose=2 "$godot_app"
          spctl --assess --type execute --verbose=4 "$godot_app"
          echo "Godot signature and Gatekeeper checks passed before execution."
          unzip -q "$templates_tgz" -d "$template_dir"
          templates_root="$template_dir/templates"
          test -s "$templates_root/version.txt"
          template_version="$(head -n 1 "$templates_root/version.txt")"
          case "$template_version" in
            "$GODOT_VERSION.stable"|"$GODOT_VERSION.stable.official."*) ;;
            *) echo "Unexpected export template version: $template_version" >&2; exit 1 ;;
          esac
          installed_templates="$HOME/Library/Application Support/Godot/export_templates/$GODOT_VERSION.stable"
          if [[ -e "$installed_templates" ]]; then
            echo "Unexpected pre-existing template directory; refusing to overwrite it." >&2
            exit 1
          fi
          mkdir -p "$installed_templates"
          cp -R "$templates_root/." "$installed_templates/"
          test -s "$installed_templates/ios.zip"
          ios_template="$template_dir/ios-template"
          mkdir -p "$ios_template"
          unzip -q "$installed_templates/ios.zip" -d "$ios_template"
          release_engine="$(find "$ios_template" -type f -path '*/libgodot.ios.release.xcframework/ios-arm64/libgodot.a' -print -quit)"
          debug_engine="$(find "$ios_template" -type f -path '*/libgodot.ios.debug.xcframework/ios-arm64/libgodot.a' -print -quit)"
          test -s "$release_engine"
          test -s "$debug_engine"
          release_members="$template_dir/release-engine-members.txt"
          debug_members="$template_dir/debug-engine-members.txt"
          /usr/bin/ar -t "$release_engine" > "$release_members"
          /usr/bin/ar -t "$debug_engine" > "$debug_members"
          grep -q 'ios.template_release.arm64' "$release_members"
          grep -q 'ios.template_debug.arm64' "$debug_members"
          if grep -q 'ios.template_debug.arm64' "$release_members"; then
            echo "The official Release template contains debug engine objects." >&2
            exit 1
          fi
          release_archs="$(xcrun lipo -archs "$release_engine")"
          [[ "$release_archs" == "arm64" ]]
          version_output="$("$godot_bin" --version)"
          case "$version_output" in
            4.6.1.stable.official.*) ;;
            *) echo "Unexpected Godot version: $version_output" >&2; exit 1 ;;
          esac
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
          echo "GODOT_TEMPLATE_VERSION=$template_version" >> "$GITHUB_ENV"
          echo "IOS_TEMPLATE_RELEASE_ENGINE=$release_engine" >> "$GITHUB_ENV"
          echo "IOS_TEMPLATE_RELEASE_MEMBERS=$release_members" >> "$GITHUB_ENV"
          echo "Godot version verified: $version_output"
          echo "Matching 4.6.1 iOS Release template verified."
      - name: Prepare isolated iOS export project and build number
        shell: bash
        env:
          IOS_BUILD_BASE: ${{ vars.IOS_BUILD_BASE }}
          IOS_MARKETING_VERSION: ${{ vars.IOS_MARKETING_VERSION }}
        run: |
          set -euo pipefail
          base="${IOS_BUILD_BASE:-1}"
          if [[ ! "$base" =~ ^[0-9]+$ ]] || (( base < 1 )); then
            echo "IOS_BUILD_BASE must be a positive decimal build number." >&2
            exit 1
          fi
          build_number=$((base + GITHUB_RUN_NUMBER))
          if (( build_number > 2147483647 )); then
            echo "Computed iOS build number is outside Apple's supported integer range." >&2
            exit 1
          fi
          marketing_version="${IOS_MARKETING_VERSION:-0.0.1}"
          if [[ ! "$marketing_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "IOS_MARKETING_VERSION must use major.minor.patch format." >&2
            exit 1
          fi
          ci_project="$RUNNER_TEMP/theresians-quest-ios-project"
          artifact_dir="$RUNNER_TEMP/theresians-quest-ios-artifact"
          rm -rf "$ci_project" "$artifact_dir"
          mkdir -p "$ci_project" "$artifact_dir"
          rsync -a \
            --exclude '.git/' \
            --exclude '.godot/' \
            --exclude '*.apk' \
            --exclude '*.ipa' \
            --exclude '*.pck' \
            --exclude '*.xcframework/' \
            --exclude '*.xcodeproj/' \
            ./ "$ci_project/"
          python3 - "$ci_project/export_presets.cfg" "$build_number" "$marketing_version" "$IOS_BUNDLE_ID" "$IOS_TEAM_ID" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          build_number, marketing_version, bundle_id, team_id = sys.argv[2:]
          text = path.read_text(encoding="utf-8")
          match = None
          for candidate in re.finditer(r"(?ms)^\[preset\.(\d+)\]\n.*?(?=^\[preset\.|\Z)", text):
              block = candidate.group(0)
              if 'name="iOS"' in block and 'platform="iOS"' in block:
                  match = candidate
                  break
          if match is None:
              raise SystemExit("The iOS preset was not found in the CI copy.")
          index = match.group(1)
          options_header = f"[preset.{index}.options]"
          options_start = text.index(options_header)
          next_section = text.find("\n[", options_start + len(options_header))
          options_end = len(text) if next_section == -1 else next_section
          options = text[options_start:options_end]

          def set_option(key, value):
              nonlocal_options[0] = re.sub(
                  rf"(?m)^{re.escape(key)}=.*$",
                  f"{key}={json.dumps(value)}",
                  nonlocal_options[0],
                  count=1,
              )
              if not re.search(rf"(?m)^{re.escape(key)}=", nonlocal_options[0]):
                  nonlocal_options[0] = nonlocal_options[0].rstrip("\n") + f"\n{key}={json.dumps(value)}\n"

          nonlocal_options = [options]
          set_option("application/app_store_team_id", team_id)
          set_option("application/bundle_identifier", bundle_id)
          set_option("application/short_version", marketing_version)
          set_option("application/version", build_number)
          set_option("application/export_project_only", True)
          text = text[:options_start] + nonlocal_options[0] + text[options_end:]
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          echo "CI_PROJECT=$ci_project" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "IOS_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "IOS_MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"

      - name: Export the Godot iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail
          # Godot's iOS project-only export is a loose project bundle. The
          # output path is the project basename; Godot creates that data
          # directory plus sibling .xcodeproj/.xcframework resources. It is
          # not a ZIP archive, even when the path has a .zip suffix.
          export_root="$RUNNER_TEMP/theresians-quest-ios-export"
          rm -rf "$export_root" "$export_root.xcodeproj" "$export_root.xcframework"
          "$GODOT_BIN" --headless --path "$CI_PROJECT" --export-release "$IOS_PRESET" "$export_root"
          xcode_project="$export_root.xcodeproj"
          data_pack="$export_root/data.pck"
          release_framework="$export_root.xcframework"
          test -d "$export_root"
          test -d "$xcode_project"
          test -s "$data_pack"
          test -d "$release_framework"
          test -s "$release_framework/ios-arm64/libgodot.a"
          engine_archive="$release_framework/ios-arm64/libgodot.a"
          exported_engine_members="$RUNNER_TEMP/theresians-quest-exported-engine-members.txt"
          /usr/bin/ar -t "$engine_archive" > "$exported_engine_members"
          grep -q 'ios.template_release.arm64' "$exported_engine_members"
          if grep -q 'ios.template_debug.arm64' "$exported_engine_members"; then
            echo "The generated Godot framework contains debug engine objects." >&2
            exit 1
          fi
          exported_engine_archs="$(xcrun lipo -archs "$engine_archive")"
          [[ "$exported_engine_archs" == "arm64" ]]
          echo "Godot iOS export output:"
          printf '  data directory: %s\n  Xcode project: %s\n  release framework: %s\n' \
            "$export_root" "$xcode_project" "$release_framework"
          echo "EXPORT_ROOT=$export_root" >> "$GITHUB_ENV"
          echo "XCODE_PROJECT=$xcode_project" >> "$GITHUB_ENV"

      - name: Verify and correct generated resource references and display names
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EXPORT_ROOT" "$XCODE_PROJECT" "$CI_PROJECT" "$RUNNER_TEMP" <<'PY'
          import os
          import re
          import sys
          from pathlib import Path

          export_root, xcode_project, source_project, work_root = (
              Path(value).resolve() for value in sys.argv[1:]
          )
          pbx = xcode_project / "project.pbxproj"
          text = pbx.read_text(encoding="utf-8")
          pcks = [path.resolve() for path in export_root.rglob("*.pck") if path.is_file()]
          if len(pcks) != 1 or pcks[0].stat().st_size == 0:
              raise SystemExit(f"Expected one non-empty exported PCK, found {len(pcks)}.")
          manifests = [
              path.resolve()
              for root in (export_root, xcode_project)
              for path in root.rglob("PrivacyInfo.xcprivacy")
              if path.is_file()
          ]
          if len(manifests) > 1:
              raise SystemExit(f"Multiple exported privacy manifests found: {manifests}")
          if manifests:
              privacy = manifests[0]
          else:
              privacy = source_project / "PrivacyInfo.xcprivacy"
              if not privacy.is_file():
                  raise SystemExit("No generated or source PrivacyInfo.xcprivacy was found.")
              privacy = privacy.resolve()

          uuid = r"[A-F0-9]{24}"
          declarations = list(re.finditer(
              rf"(?m)^\s*({uuid})(?:\s*/\*.*?\*/)?\s*=\s*\{{",
              text,
          ))

          def body(identifier):
              declaration = next((item for item in declarations if item.group(1) == identifier), None)
              if declaration is None:
                  raise SystemExit(f"Xcode object {identifier} is missing.")
              start = declaration.end() - 1
              depth, quoted, escaped = 0, False, False
              for index in range(start, len(text)):
                  char = text[index]
                  if quoted:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          quoted = False
                  elif char == '"':
                      quoted = True
                  elif char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          return text[start + 1:index]
              raise SystemExit(f"Xcode object {identifier} is unterminated.")

          root = re.search(rf"(?m)^\s*rootObject = ({uuid})\b", text)
          if root is None:
              raise SystemExit("Xcode project root object is missing.")
          project_body = body(root.group(1))
          main = re.search(rf"\bmainGroup = ({uuid})\b", project_body)
          if main is None:
              raise SystemExit("Xcode project main group is missing.")
          main_group = main.group(1)
          main_body = body(main_group)
          child_list = re.search(r"children\s*=\s*\((.*?)\);", main_body, re.S)
          if child_list is None:
              raise SystemExit("Xcode main group has no children.")
          main_children = set(re.findall(uuid, child_list.group(1)))
          group_path = re.search(r"\bpath\s*=\s*(\"[^\"]*\"|[^;]+);", main_body)
          base = (xcode_project.parent / (group_path.group(1).strip().strip('"') if group_path else "")).resolve()

          lines = text.splitlines(keepends=True)
          pck_refs, privacy_refs = [], []
          for index, line in enumerate(lines):
              if "isa = PBXFileReference;" not in line:
                  continue
              identifier = re.match(rf"\s*({uuid})\b", line)
              if identifier is None:
                  continue
              if re.search(r"(?i)\.pck\b", line):
                  pck_refs.append((index, identifier.group(1)))
              if "PrivacyInfo.xcprivacy" in line:
                  privacy_refs.append((index, identifier.group(1)))
          if len(pck_refs) != 1 or len(privacy_refs) != 1:
              raise SystemExit(
                  f"Expected one PCK and privacy file reference; found {len(pck_refs)} and {len(privacy_refs)}."
              )

          def fix_path(reference, target, label):
              index, identifier = reference
              if identifier not in main_children:
                  raise SystemExit(f"The generated {label} file reference is not in the verified root group.")
              line = lines[index]
              tree = re.search(r"\bsourceTree\s*=\s*(\"[^\"]*\"|[^;]+);", line)
              path = re.search(r"\bpath\s*=\s*(\"[^\"]*\"|[^;]+);", line)
              if tree is None or path is None or tree.group(1).strip().strip('"') != "<group>":
                  raise SystemExit(f"The generated {label} file reference has an unsupported form.")
              old = path.group(1).strip().strip('"')
              expected = os.path.relpath(target, base).replace(os.sep, "/")
              if (base / old).resolve() != target:
                  lines[index] = re.sub(
                      r"\bpath\s*=\s*(\"[^\"]*\"|[^;]+);",
                      f'path = "{expected}";',
                      line,
                      count=1,
                  )
                  print(f"Corrected {label}: {old} -> {expected}")
              else:
                  print(f"Verified {label}: {old}")
              if (base / expected).resolve() != target:
                  raise SystemExit(f"The {label} reference does not resolve to its verified file.")

          fix_path(pck_refs[0], pcks[0], "PCK path")
          fix_path(privacy_refs[0], privacy, "privacy manifest path")
          corrected = 0
          for index, line in enumerate(lines):
              if re.search(r"\b(?:productName|PRODUCT_NAME)\s*=", line) or "INFOPLIST_KEY_CFBundleDisplayName" in line:
                  replacement = line.replace("Theresian&apos;s Quest", "Theresian's Quest")
                  if replacement != line:
                      lines[index] = replacement
                      corrected += 1
          text = "".join(lines)
          product = re.findall(r'(?m)^\s*productName\s*=\s*"([^"]*)";', text)
          products = re.findall(r'(?m)^\s*PRODUCT_NAME\s*=\s*"([^"]*)";', text)
          displays = re.findall(r'(?m)^\s*INFOPLIST_KEY_CFBundleDisplayName\s*=\s*"([^"]*)";', text)
          if product != ["Theresian's Quest"]:
              raise SystemExit(f"Unexpected productName: {product}")
          if not products or any(value != "Theresian's Quest" for value in products):
              raise SystemExit(f"Unexpected PRODUCT_NAME values: {products}")
          if not displays or any(value != "Theresian's Quest" for value in displays):
              raise SystemExit(f"Unexpected display names: {displays}")
          if "Theresian&apos;s Quest" in text:
              raise SystemExit("An escaped Theresian's Quest name remains in the generated Xcode project.")
          pbx.write_text(text, encoding="utf-8")
          (work_root / "xcode-resource-corrections.txt").write_text(
              f"xcode_project={xcode_project}\n"
              f"pck={pcks[0]}\n"
              f"pck_reference={os.path.relpath(pcks[0], base)}\n"
              f"privacy_manifest={privacy}\n"
              f"privacy_reference={os.path.relpath(privacy, base)}\n"
              f"escaped_name_lines_corrected={corrected}\n",
              encoding="utf-8",
          )
          PY

      - name: Validate Apple signing inputs and archive/export IPA
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' || inputs.build_signed == true }}
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for variable_name in IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_PROVISIONING_PROFILE_NAME IOS_KEYCHAIN_PASSWORD; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Required Apple signing input is missing: $variable_name" >&2
              exit 1
            fi
          done
          keychain_path="$RUNNER_TEMP/theresians-quest-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/apple-distribution.p12"
          profile_path="$RUNNER_TEMP/appstore.mobileprovision"
          profile_plist="$RUNNER_TEMP/appstore-profile.plist"
          archive_path="$RUNNER_TEMP/theresians-quest.xcarchive"
          export_dir="$RUNNER_TEMP/theresians-quest-ipa"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"
          chmod 600 "$certificate_path" "$profile_path"
          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print:UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print:Name' "$profile_plist")"
          if [[ "$profile_name" != "$IOS_PROVISIONING_PROFILE_NAME" ]]; then
            echo "The provisioning profile name does not match the approved GitHub secret." >&2
            exit 1
          fi
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"
          security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security default-keychain -s "$keychain_path"
          scheme="$(xcodebuild -project "$XCODE_PROJECT" -list -json | python3 -c 'import json,sys; data=json.load(sys.stdin); print(data["project"]["schemes"][0])')"
          link_map="$RUNNER_TEMP/theresians-quest-ios-engine-link-map.txt"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$scheme" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$profile_name" \
             LD_GENERATE_MAP_FILE=YES \
             "LD_MAP_FILE_PATH=$link_map" \
            archive
           test -s "$link_map"
           grep -F 'libgodot.a(' "$link_map" >/dev/null
           grep -E 'ios\.template_release\.arm64' "$link_map" >/dev/null
           if grep -E 'ios\.template_debug\.arm64' "$link_map" >/dev/null; then
             echo "The signed Release link map contains debug Godot engine objects." >&2
             exit 1
           fi
          python3 - "$RUNNER_TEMP/ExportOptions.plist" "$IOS_BUNDLE_ID" "$IOS_TEAM_ID" "$profile_name" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          bundle_id, team_id, profile_name = sys.argv[2:]
          data = {
              "method": "app-store",
              "signingStyle": "manual",
              "signingCertificate": "Apple Distribution",
              "teamID": team_id,
              "provisioningProfiles": {bundle_id: profile_name},
          }
          path.write_bytes(plistlib.dumps(data, fmt=plistlib.FMT_XML))
          PY
          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$export_dir"
          ipa_path="$(find "$export_dir" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -s "$ipa_path"
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Verify IPA metadata, architecture, signature, and checksum
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' || inputs.build_signed == true }}
        shell: bash
        run: |
          set -euo pipefail
          unpacked="$RUNNER_TEMP/theresians-quest-ipa-unpacked"
          rm -rf "$unpacked"
          mkdir -p "$unpacked"
          ditto -x -k "$IPA_PATH" "$unpacked"
          app_path="$(find "$unpacked/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$app_path"
          plist="$app_path/Info.plist"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print:CFBundleIdentifier' "$plist")"
          short_version="$(/usr/libexec/PlistBuddy -c 'Print:CFBundleShortVersionString' "$plist")"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print:CFBundleVersion' "$plist")"
          [[ "$bundle_id" == "$IOS_BUNDLE_ID" ]]
          [[ "$short_version" == "$IOS_MARKETING_VERSION" ]]
          [[ "$build_number" == "$IOS_BUILD_NUMBER" ]]
          executable="$(/usr/libexec/PlistBuddy -c 'Print:CFBundleExecutable' "$plist")"
          lipo_output="$(lipo -info "$app_path/$executable")"
          echo "$lipo_output"
          grep -q 'arm64' <<< "$lipo_output"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signing_report="$RUNNER_TEMP/theresians-quest-signing-report.txt"
          codesign -dvvv "$app_path" > "$signing_report" 2>&1 || true
          grep -q 'Authority=Apple Distribution' "$signing_report"
          pck_source="$(find "$EXPORT_ROOT" -type f -name '*.pck' -print -quit)"
          test -s "$pck_source"
          pck_source_count="$(find "$EXPORT_ROOT" -type f -name '*.pck' -print | wc -l | tr -d '[:space:]')"
          [[ "$pck_source_count" == "1" ]]
          app_pck="$(find "$app_path" -type f -name '*.pck' -print -quit)"
          test -s "$app_pck"
          app_pck_count="$(find "$app_path" -type f -name '*.pck' -print | wc -l | tr -d '[:space:]')"
          [[ "$app_pck_count" == "1" ]]
          cmp -s "$pck_source" "$app_pck"
          privacy_source="$CI_PROJECT/PrivacyInfo.xcprivacy"
          privacy_in_app="$app_path/PrivacyInfo.xcprivacy"
          test -s "$privacy_source"
          test -s "$privacy_in_app"
          plutil -lint "$privacy_in_app"
          cmp -s "$privacy_source" "$privacy_in_app"
          sha256="$(shasum -a 256 "$IPA_PATH" | awk '{print toupper($1)}')"
          size_bytes="$(stat -f '%z' "$IPA_PATH")"
          report="$ARTIFACT_DIR/ios-build-report.txt"
          {
            echo "source_commit=$GITHUB_SHA"
            echo "godot_version=$GODOT_VERSION"
            echo "export_preset=$IOS_PRESET"
            echo "backend=https://theresiansquest.com"
            echo "bundle_id=$bundle_id"
            echo "team_id=$IOS_TEAM_ID"
            echo "marketing_version=$short_version"
            echo "build_number=$build_number"
            echo "architecture=arm64"
            echo "signing=Apple Distribution"
            echo "ipa_file=$(basename "$IPA_PATH")"
            echo "ipa_size_bytes=$size_bytes"
            echo "sha256=$sha256"
          } > "$report"
          {
            echo "## iOS build"
            echo "- Source commit: `$GITHUB_SHA`"
            echo "- Backend: `https://theresiansquest.com`"
            echo "- Godot: `$GODOT_VERSION`"
            echo "- Preset: `$IOS_PRESET`"
            echo "- Bundle ID: `$bundle_id`"
            echo "- Version: `$short_version ($build_number)`"
            echo "- Architecture: `arm64`"
            echo "- Signing: Apple Distribution"
            echo "- IPA size: `$size_bytes bytes`"
            echo "- SHA-256: `$sha256`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified IPA artifact
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' || inputs.build_signed == true }}
        uses: actions/upload-artifact@v4
        with:
          name: TheresiansQuest-iOS-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/theresians-quest-ipa/*.ipa
            ${{ runner.temp }}/theresians-quest-ios-artifact/ios-build-report.txt

      - name: Upload verified IPA to internal TestFlight
        if: ${{ (vars.IOS_SIGNING_ENABLED == 'true' || inputs.build_signed == true) && (vars.IOS_TESTFLIGHT_UPLOAD_ENABLED == 'true' || inputs.upload_testflight == true) }}
        shell: bash
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for variable_name in APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_API_PRIVATE_KEY; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "TestFlight upload is enabled but this input is missing: $variable_name" >&2
              exit 1
            fi
          done
          key_dir="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          key_path="$key_dir/AuthKey_${APPSTORE_KEY_ID}.p8"
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"
          echo "TestFlight upload request accepted by App Store Connect; processing remains Apple-controlled." >> "$GITHUB_STEP_SUMMARY"

      - name: Explain skipped TestFlight upload
        if: ${{ (vars.IOS_SIGNING_ENABLED == 'true' || inputs.build_signed == true) && vars.IOS_TESTFLIGHT_UPLOAD_ENABLED != 'true' && inputs.upload_testflight != true }}
        shell: bash
        run: |
          echo "IPA artifact was verified and uploaded to GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
          echo "TestFlight upload skipped: enable IOS_TESTFLIGHT_UPLOAD_ENABLED or use the manual workflow input after Apple credentials are configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Explain skipped signed IPA build
        if: ${{ vars.IOS_SIGNING_ENABLED != 'true' && inputs.build_signed != true }}
        shell: bash
        run: |
          echo "Unsigned iOS project export completed." >> "$GITHUB_STEP_SUMMARY"
          echo "Signed IPA/archive skipped: set IOS_SIGNING_ENABLED=true only after Apple signing secrets are configured, or use workflow_dispatch with build_signed enabled." >> "$GITHUB_STEP_SUMMARY"
