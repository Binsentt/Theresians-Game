name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      build_signed:
        description: Build and verify a signed IPA (requires Apple signing secrets)
        required: false
        type: boolean
        default: false
      upload_testflight:
        description: Upload the verified IPA to App Store Connect for TestFlight processing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-testflight-release-${{ github.repository }}
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.6.1
  GODOT_EDITOR_SHA256: f43613ad72ab1cc9ef14383545f4de344844451a5c9c5f4ea4a923f1f34f91e4
  GODOT_TEMPLATES_SHA256: e6d372afd4fdfaae9571eb5e3568afcd96ce6db9a569244034154faf0ac69875
  IOS_PRESET: iOS
  IOS_BUNDLE_ID: com.theresiansquest.game
  IOS_TEAM_ID: 7A4H2D888M
  IOS_MIN_IOS_VERSION: "15.0"

jobs:
  export-ios:
    name: Export and verify iOS IPA
    if: github.ref == 'refs/heads/main'
    runs-on: macos-26
    environment:
      name: ${{ inputs.build_signed == true && vars.IOS_SIGNING_ENABLED == 'true' && 'ios-appstore-release' || 'ios-export-validation' }}
    timeout-minutes: 60
    steps:
      - name: Check out the exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Verify source, iOS preset, and production API
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f export_presets.cfg
          test -f Data/api_config.json
          actual_sha="$(git rev-parse HEAD)"
          if [[ "$actual_sha" != "$GITHUB_SHA" ]]; then
            echo "Checked-out commit does not match the triggering SHA." >&2
            exit 1
          fi
          python3 - "$IOS_BUNDLE_ID" "$IOS_TEAM_ID" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          expected_bundle, expected_team = sys.argv[1:]
          text = Path("export_presets.cfg").read_text(encoding="utf-8")
          ios = None
          for block in re.split(r"(?m)(?=^\[preset\.\d+\]\r?\n)", text):
              if 'name="iOS"' in block and 'platform="iOS"' in block:
                  ios = block
                  break
          if ios is None:
              raise SystemExit("The existing iOS export preset was not found.")
          checks = {
              'architectures/arm64=true': 'iOS preset must enable arm64.',
              f'application/app_store_team_id="{expected_team}"': 'iOS preset Team ID does not match the approved project Team ID.',
              f'application/bundle_identifier="{expected_bundle}"': 'iOS bundle identifier is not the expected existing ID.',
          }
          for needle, message in checks.items():
              if needle not in ios:
                  raise SystemExit(message)
          config = json.loads(Path("Data/api_config.json").read_text(encoding="utf-8"))
          if config.get("production_url") != "https://theresiansquest.com":
              raise SystemExit("The committed production API URL is not the approved URL.")
          print("iOS preset and production API URL verified.")
          print(f"Bundle ID: {expected_bundle}")
          print(f"Apple Team ID: {expected_team}")
          PY

      - name: Enforce explicit signing and upload gates
        shell: bash
        env:
          BUILD_SIGNED_INPUT: ${{ inputs.build_signed }}
          UPLOAD_TESTFLIGHT_INPUT: ${{ inputs.upload_testflight }}
          IOS_SIGNING_ENABLED: ${{ vars.IOS_SIGNING_ENABLED }}
          IOS_TESTFLIGHT_UPLOAD_ENABLED: ${{ vars.IOS_TESTFLIGHT_UPLOAD_ENABLED }}
        run: |
          set -euo pipefail
          if [[ "$BUILD_SIGNED_INPUT" == "true" && "$IOS_SIGNING_ENABLED" != "true" ]]; then
            echo "Signed IPA requested, but IOS_SIGNING_ENABLED is not true. The signing step is blocked." >&2
            exit 1
          fi
          if [[ "$UPLOAD_TESTFLIGHT_INPUT" == "true" && "$IOS_TESTFLIGHT_UPLOAD_ENABLED" != "true" ]]; then
            echo "TestFlight upload requested, but IOS_TESTFLIGHT_UPLOAD_ENABLED is not true. The upload step is blocked." >&2
            exit 1
          fi
          if [[ "$UPLOAD_TESTFLIGHT_INPUT" == "true" && "$BUILD_SIGNED_INPUT" != "true" ]]; then
            echo "TestFlight upload requires build_signed=true in the same manual run." >&2
            exit 1
          fi
          if [[ "$UPLOAD_TESTFLIGHT_INPUT" == "true" && "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
            echo "A rerun cannot upload to TestFlight; start a new manual release run to avoid duplicate uploads." >&2
            exit 1
          fi
          echo "Manual request and repository release gates are consistent."

      - name: Select and verify Xcode 26.3 and iOS 26.2 simulator runtime
        shell: bash
        run: |
          set -euo pipefail
          developer_dir="/Applications/Xcode_26.3.app/Contents/Developer"
          if [[ ! -d "$developer_dir" ]]; then
            echo "Required Xcode 26.3 installation was not found at $developer_dir." >&2
            exit 1
          fi
          export DEVELOPER_DIR="$developer_dir"
          xcode_version="$(xcodebuild -version)"
          printf '%s\n' "$xcode_version"
          if ! grep -Fxq "Xcode 26.3" <<< "$xcode_version"; then
            echo "Expected Xcode 26.3; refusing to build with another toolchain." >&2
            exit 1
          fi
          sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
          printf 'iOS SDK: %s\n' "$sdk_version"
          if [[ "$sdk_version" != "26.2" ]]; then
            echo "Expected the Xcode 26.3 iOS 26.2 SDK; got $sdk_version." >&2
            exit 1
          fi
          runtime_json="$(xcrun simctl list runtimes -j)"
          python3 - "$runtime_json" <<'PY'
          import json
          import sys

          runtimes = json.loads(sys.argv[1]).get("runtimes", [])
          matches = [runtime for runtime in runtimes
                     if runtime.get("name") == "iOS 26.2"
                     and runtime.get("isAvailable") is True]
          if not matches:
              raise SystemExit("The required iOS 26.2 simulator runtime is unavailable.")
          print(f"iOS Simulator runtime: {matches[0]['name']} ({matches[0].get('buildversion', 'build unknown')})")
          PY
          echo "DEVELOPER_DIR=$developer_dir" >> "$GITHUB_ENV"

      - name: Download, verify, and install official Godot 4.6.1
        shell: bash
        run: |
          set -euo pipefail
          godot_dir="$RUNNER_TEMP/godot-${GODOT_VERSION}"
          template_dir="$RUNNER_TEMP/godot-export-templates-${GODOT_VERSION}"
          if [[ -e "$godot_dir" || -e "$template_dir" ]]; then
            echo "Unexpected pre-existing Godot staging directory; refusing to reuse it." >&2
            exit 1
          fi
          mkdir -p "$godot_dir" "$template_dir"
          godot_zip="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          templates_tgz="$RUNNER_TEMP/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          curl --fail --location --retry 3 --silent --show-error --output "$godot_zip" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          curl --fail --location --retry 3 --silent --show-error --output "$templates_tgz" "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          printf '%s  %s\n' "$GODOT_EDITOR_SHA256" "$godot_zip" | shasum -a 256 -c -
          printf '%s  %s\n' "$GODOT_TEMPLATES_SHA256" "$templates_tgz" | shasum -a 256 -c -
          unzip -tq "$godot_zip"
          unzip -tq "$templates_tgz"
          unzip -q "$godot_zip" -d "$godot_dir"
          godot_app="$(find "$godot_dir" -type d -name Godot.app -print -quit)"
          test -n "$godot_app"
          godot_bin="$godot_app/Contents/MacOS/Godot"
          test -x "$godot_bin"
          codesign --verify --deep --strict --verbose=2 "$godot_app"
          spctl --assess --type execute --verbose=4 "$godot_app"
          echo "Godot signature and Gatekeeper checks passed before execution."
          unzip -q "$templates_tgz" -d "$template_dir"
          templates_root="$template_dir/templates"
          test -s "$templates_root/version.txt"
          template_version="$(head -n 1 "$templates_root/version.txt")"
          case "$template_version" in
            "$GODOT_VERSION.stable"|"$GODOT_VERSION.stable.official."*) ;;
            *) echo "Unexpected export template version: $template_version" >&2; exit 1 ;;
          esac
          installed_templates="$HOME/Library/Application Support/Godot/export_templates/$GODOT_VERSION.stable"
          if [[ -e "$installed_templates" ]]; then
            echo "Unexpected pre-existing template directory; refusing to overwrite it." >&2
            exit 1
          fi
          mkdir -p "$installed_templates"
          cp -R "$templates_root/." "$installed_templates/"
          test -s "$installed_templates/ios.zip"
          ios_template="$template_dir/ios-template"
          mkdir -p "$ios_template"
          unzip -q "$installed_templates/ios.zip" -d "$ios_template"
          release_engine="$(find "$ios_template" -type f -path '*/libgodot.ios.release.xcframework/ios-arm64/libgodot.a' -print -quit)"
          debug_engine="$(find "$ios_template" -type f -path '*/libgodot.ios.debug.xcframework/ios-arm64/libgodot.a' -print -quit)"
          test -s "$release_engine"
          test -s "$debug_engine"
          release_members="$template_dir/release-engine-members.txt"
          debug_members="$template_dir/debug-engine-members.txt"
          /usr/bin/ar -t "$release_engine" > "$release_members"
          /usr/bin/ar -t "$debug_engine" > "$debug_members"
          grep -q 'ios.template_release.arm64' "$release_members"
          grep -q 'ios.template_debug.arm64' "$debug_members"
          if grep -q 'ios.template_debug.arm64' "$release_members"; then
            echo "The official Release template contains debug engine objects." >&2
            exit 1
          fi
          release_archs="$(xcrun lipo -archs "$release_engine")"
          [[ "$release_archs" == "arm64" ]]
          version_output="$("$godot_bin" --version)"
          case "$version_output" in
            4.6.1.stable.official.*) ;;
            *) echo "Unexpected Godot version: $version_output" >&2; exit 1 ;;
          esac
          echo "GODOT_BIN=$godot_bin" >> "$GITHUB_ENV"
          echo "GODOT_TEMPLATE_VERSION=$template_version" >> "$GITHUB_ENV"
          echo "IOS_TEMPLATE_RELEASE_ENGINE=$release_engine" >> "$GITHUB_ENV"
          echo "IOS_TEMPLATE_RELEASE_MEMBERS=$release_members" >> "$GITHUB_ENV"
          echo "Godot version verified: $version_output"
          echo "Matching 4.6.1 iOS Release template verified."
      - name: Prepare isolated iOS export project and build number
        shell: bash
        env:
          IOS_BUILD_BASE: ${{ vars.IOS_BUILD_BASE }}
          IOS_MARKETING_VERSION: ${{ vars.IOS_MARKETING_VERSION }}
          BUILD_SIGNED_INPUT: ${{ inputs.build_signed }}
        run: |
          set -euo pipefail
          if [[ "${BUILD_SIGNED_INPUT:-false}" == "true" && -z "${IOS_BUILD_BASE:-}" ]]; then
            echo "Set IOS_BUILD_BASE to a value greater than the highest App Store Connect build number for this marketing version before requesting a signed build." >&2
            exit 1
          fi
          base="${IOS_BUILD_BASE:-1}"
          if [[ ! "$base" =~ ^[0-9]+$ ]]; then
            echo "IOS_BUILD_BASE must be a positive decimal offset." >&2
            exit 1
          fi
          base="$(python3 -c 'import sys; print(int(sys.argv[1], 10))' "$base")"
          if (( base < 1 || base > 2147483647 )); then
            echo "IOS_BUILD_BASE must be between 1 and Apple's supported integer limit." >&2
            exit 1
          fi
          run_number="$GITHUB_RUN_NUMBER"
          run_attempt="${GITHUB_RUN_ATTEMPT:-1}"
          if [[ ! "$run_number" =~ ^[0-9]+$ ]] || (( run_number < 1 )); then
            echo "GitHub Actions supplied an invalid workflow run number." >&2
            exit 1
          fi
          if [[ ! "$run_attempt" =~ ^[0-9]+$ ]] || (( run_attempt < 1 || run_attempt > 99 )); then
            echo "Workflow run attempt must be between 1 and 99 to reserve a unique build-number sequence." >&2
            exit 1
          fi
          # Reserve 100 build numbers per run so a GitHub rerun gets a larger CFBundleVersion.
          build_number="$(python3 - "$base" "$run_number" "$run_attempt" <<'PY_BUILD_NUMBER'
          import sys

          base, run_number, run_attempt = (int(value, 10) for value in sys.argv[1:])
          build_number = base + run_number * 100 + run_attempt
          if build_number > 2147483647:
              raise SystemExit("Computed iOS build number is outside Apple's supported integer range.")
          print(build_number)
          PY_BUILD_NUMBER
          )"
          marketing_version="${IOS_MARKETING_VERSION:-0.0.1}"
          if [[ "${BUILD_SIGNED_INPUT:-false}" == "true" && -z "${IOS_MARKETING_VERSION:-}" ]]; then
            echo "Set the IOS_MARKETING_VERSION Actions variable before requesting a signed IPA; the placeholder default is blocked for signed builds." >&2
            exit 1
          fi
          if [[ ! "$marketing_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "IOS_MARKETING_VERSION must use major.minor.patch format (for example, 1.2.3)." >&2
            exit 1
          fi
          ci_project="$RUNNER_TEMP/theresians-quest-ios-project"
          artifact_dir="$RUNNER_TEMP/theresians-quest-ios-artifact"
          rm -rf "$ci_project" "$artifact_dir"
          mkdir -p "$ci_project" "$artifact_dir"
          rsync -a \
            --exclude '.git/' \
            --exclude '.godot/' \
            --exclude '*.apk' \
            --exclude '*.ipa' \
            --exclude '*.pck' \
            --exclude '*.xcframework/' \
            --exclude '*.xcodeproj/' \
            ./ "$ci_project/"
          python3 - "$ci_project/export_presets.cfg" "$build_number" "$marketing_version" "$IOS_BUNDLE_ID" "$IOS_TEAM_ID" "$IOS_MIN_IOS_VERSION" <<'PY'
          import json
          import re
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          build_number, marketing_version, bundle_id, team_id, min_ios_version = sys.argv[2:]
          text = path.read_text(encoding="utf-8")
          match = None
          for candidate in re.finditer(r"(?ms)^\[preset\.(\d+)\]\n.*?(?=^\[preset\.|\Z)", text):
              block = candidate.group(0)
              if 'name="iOS"' in block and 'platform="iOS"' in block:
                  match = candidate
                  break
          if match is None:
              raise SystemExit("The iOS preset was not found in the CI copy.")
          index = match.group(1)
          options_header = f"[preset.{index}.options]"
          options_start = text.index(options_header)
          next_section = text.find("\n[", options_start + len(options_header))
          options_end = len(text) if next_section == -1 else next_section
          options = text[options_start:options_end]

          def set_option(key, value):
              nonlocal_options[0] = re.sub(
                  rf"(?m)^{re.escape(key)}=.*$",
                  f"{key}={json.dumps(value)}",
                  nonlocal_options[0],
                  count=1,
              )
              if not re.search(rf"(?m)^{re.escape(key)}=", nonlocal_options[0]):
                  nonlocal_options[0] = nonlocal_options[0].rstrip("\n") + f"\n{key}={json.dumps(value)}\n"

          nonlocal_options = [options]
          set_option("application/app_store_team_id", team_id)
          set_option("application/bundle_identifier", bundle_id)
          set_option("application/short_version", marketing_version)
          set_option("application/version", build_number)
          set_option("application/min_ios_version", min_ios_version)
          set_option("application/export_project_only", True)
          text = text[:options_start] + nonlocal_options[0] + text[options_end:]
          path.write_text(text, encoding="utf-8", newline="\n")
          PY
          echo "CI_PROJECT=$ci_project" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=$artifact_dir" >> "$GITHUB_ENV"
          echo "IOS_BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          echo "IOS_MARKETING_VERSION=$marketing_version" >> "$GITHUB_ENV"

      - name: Export the Godot iOS Xcode project
        shell: bash
        run: |
          set -euo pipefail
          # Godot's iOS project-only export is a loose project bundle. The
          # output path is the project basename; Godot creates that data
          # directory plus sibling .xcodeproj/.xcframework resources. It is
          # not a ZIP archive, even when the path has a .zip suffix.
          export_root="$RUNNER_TEMP/theresians-quest-ios-export"
          rm -rf "$export_root" "$export_root.xcodeproj" "$export_root.xcframework"
          "$GODOT_BIN" --headless --path "$CI_PROJECT" --export-release "$IOS_PRESET" "$export_root"
          xcode_project="$export_root.xcodeproj"
          release_framework="$export_root.xcframework"
          test -d "$export_root"
          test -d "$xcode_project"
          data_pack="${export_root}.pck"
          if [[ ! -s "$data_pack" ]]; then
            echo "Expected a non-empty exported PCK at $data_pack." >&2
            exit 1
          fi
          echo "Verified exported PCK: $data_pack"
          echo "IOS_DATA_PCK=$data_pack" >> "$GITHUB_ENV"
          test -d "$release_framework"
          test -s "$release_framework/ios-arm64/libgodot.a"
          engine_archive="$release_framework/ios-arm64/libgodot.a"
          exported_engine_members="$RUNNER_TEMP/theresians-quest-exported-engine-members.txt"
          /usr/bin/ar -t "$engine_archive" > "$exported_engine_members"
          grep -q 'ios.template_release.arm64' "$exported_engine_members"
          if grep -q 'ios.template_debug.arm64' "$exported_engine_members"; then
            echo "The generated Godot framework contains debug engine objects." >&2
            exit 1
          fi
          exported_engine_archs="$(xcrun lipo -archs "$engine_archive")"
          [[ "$exported_engine_archs" == "arm64" ]]
          echo "Godot iOS export output:"
          printf '  data directory: %s\n  Xcode project: %s\n  release framework: %s\n' \
            "$export_root" "$xcode_project" "$release_framework"
          echo "EXPORT_ROOT=$export_root" >> "$GITHUB_ENV"
          echo "XCODE_PROJECT=$xcode_project" >> "$GITHUB_ENV"

      - name: Verify and correct generated resource references and display names
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$EXPORT_ROOT" "$XCODE_PROJECT" "$CI_PROJECT" "$RUNNER_TEMP" "$IOS_DATA_PCK" "$IOS_BUNDLE_ID" "$IOS_MIN_IOS_VERSION" <<'PY'
          import json
          import os
          import re
          import struct
          import sys
          from pathlib import Path

          export_root, xcode_project, source_project, work_root, data_pck = (
              Path(value).resolve() for value in sys.argv[1:6]
          )
          expected_bundle, expected_minimum_ios = sys.argv[6:]
          pbx = xcode_project / "project.pbxproj"
          text = pbx.read_text(encoding="utf-8")
          expected_pck = Path(f"{export_root}.pck").resolve()
          if data_pck != expected_pck:
              raise SystemExit(
                  f"The recorded PCK path does not match the export destination: "
                  f"{data_pck} != {expected_pck}"
              )
          if not data_pck.is_file() or data_pck.stat().st_size == 0:
              raise SystemExit(f"Expected a non-empty exported PCK at {data_pck}.")
          manifests = [
              path.resolve()
              for root in (export_root, xcode_project)
              for path in root.rglob("PrivacyInfo.xcprivacy")
              if path.is_file()
          ]
          if len(manifests) > 1:
              raise SystemExit(f"Multiple exported privacy manifests found: {manifests}")
          if manifests:
              privacy = manifests[0]
          else:
              privacy = source_project / "PrivacyInfo.xcprivacy"
              if not privacy.is_file():
                  raise SystemExit("No generated or source PrivacyInfo.xcprivacy was found.")
              privacy = privacy.resolve()

          uuid = r"[A-F0-9]{24}"
          declarations = list(re.finditer(
              rf"(?m)^\s*({uuid})(?:\s*/\*.*?\*/)?\s*=\s*\{{",
              text,
          ))

          def body(identifier):
              declaration = next((item for item in declarations if item.group(1) == identifier), None)
              if declaration is None:
                  raise SystemExit(f"Xcode object {identifier} is missing.")
              start = declaration.end() - 1
              depth, quoted, escaped = 0, False, False
              for index in range(start, len(text)):
                  char = text[index]
                  if quoted:
                      if escaped:
                          escaped = False
                      elif char == "\\":
                          escaped = True
                      elif char == '"':
                          quoted = False
                  elif char == '"':
                      quoted = True
                  elif char == "{":
                      depth += 1
                  elif char == "}":
                      depth -= 1
                      if depth == 0:
                          return text[start + 1:index]
              raise SystemExit(f"Xcode object {identifier} is unterminated.")

          root = re.search(rf"(?m)^\s*rootObject = ({uuid})\b", text)
          if root is None:
              raise SystemExit("Xcode project root object is missing.")
          project_body = body(root.group(1))
          main = re.search(rf"\bmainGroup = ({uuid})\b", project_body)
          if main is None:
              raise SystemExit("Xcode project main group is missing.")
          main_group = main.group(1)
          main_body = body(main_group)
          child_list = re.search(r"children\s*=\s*\((.*?)\);", main_body, re.S)
          if child_list is None:
              raise SystemExit("Xcode main group has no children.")
          main_children = set(re.findall(uuid, child_list.group(1)))
          group_path = re.search(r"\bpath\s*=\s*(\"[^\"]*\"|[^;]+);", main_body)
          base = (xcode_project.parent / (group_path.group(1).strip().strip('"') if group_path else "")).resolve()

          lines = text.splitlines(keepends=True)
          pck_refs, privacy_refs = [], []
          for index, line in enumerate(lines):
              if "isa = PBXFileReference;" not in line:
                  continue
              identifier = re.match(rf"\s*({uuid})\b", line)
              if identifier is None:
                  continue
              if re.search(r"(?i)\.pck\b", line):
                  pck_refs.append((index, identifier.group(1)))
              if "PrivacyInfo.xcprivacy" in line:
                  privacy_refs.append((index, identifier.group(1)))
          if len(pck_refs) != 1 or len(privacy_refs) != 1:
              raise SystemExit(
                  f"Expected one PCK and privacy file reference; found {len(pck_refs)} and {len(privacy_refs)}."
              )

          build_file_ids_by_ref = {}
          for declaration in declarations:
              identifier = declaration.group(1)
              object_body = body(identifier)
              if not re.search(r"\bisa\s*=\s*PBXBuildFile\s*;", object_body):
                  continue
              file_ref = re.search(rf"\bfileRef\s*=\s*({uuid})\b", object_body)
              if file_ref:
                  build_file_ids_by_ref.setdefault(file_ref.group(1), set()).add(identifier)
          resource_build_files = set()
          for declaration in declarations:
              identifier = declaration.group(1)
              object_body = body(identifier)
              if not re.search(r"\bisa\s*=\s*PBXResourcesBuildPhase\s*;", object_body):
                  continue
              files_block = re.search(r"files\s*=\s*\((.*?)\);", object_body, re.S)
              if files_block:
                  resource_build_files.update(re.findall(uuid, files_block.group(1)))
          for label, reference in (("PCK", pck_refs[0]), ("privacy manifest", privacy_refs[0])):
              referenced_build_files = build_file_ids_by_ref.get(reference[1], set())
              if not referenced_build_files.intersection(resource_build_files):
                  raise SystemExit(f"The generated {label} reference is not in an Xcode Resources build phase.")

          def fix_path(reference, target, label):
              index, identifier = reference
              if identifier not in main_children:
                  raise SystemExit(f"The generated {label} file reference is not in the verified root group.")
              line = lines[index]
              tree = re.search(r"\bsourceTree\s*=\s*(\"[^\"]*\"|[^;]+);", line)
              path = re.search(r"\bpath\s*=\s*(\"[^\"]*\"|[^;]+);", line)
              if tree is None or path is None or tree.group(1).strip().strip('"') != "<group>":
                  raise SystemExit(f"The generated {label} file reference has an unsupported form.")
              old = path.group(1).strip().strip('"')
              expected = os.path.relpath(target, base).replace(os.sep, "/")
              if (base / old).resolve() != target:
                  lines[index] = re.sub(
                      r"\bpath\s*=\s*(\"[^\"]*\"|[^;]+);",
                      f'path = "{expected}";',
                      line,
                      count=1,
                  )
                  print(f"Corrected {label}: {old} -> {expected}")
              else:
                  print(f"Verified {label}: {old}")
              if (base / expected).resolve() != target:
                  raise SystemExit(f"The {label} reference does not resolve to its verified file.")

          fix_path(pck_refs[0], data_pck, "PCK path")
          fix_path(privacy_refs[0], privacy, "privacy manifest path")
          corrected = 0
          for index, line in enumerate(lines):
              if re.search(r"\bproductName\s*=", line) or "INFOPLIST_KEY_CFBundleDisplayName" in line:
                  replacement = line.replace("Theresian&apos;s Quest", "Theresian's Quest")
                  if replacement != line:
                      lines[index] = replacement
                      corrected += 1
          text = "".join(lines)
          product = re.findall(r'(?m)^\s*productName\s*=\s*"([^"]*)";', text)
          products = re.findall(r'(?m)^\s*PRODUCT_NAME\s*=\s*"([^"]*)";', text)
          displays = re.findall(r'(?m)^\s*INFOPLIST_KEY_CFBundleDisplayName\s*=\s*"([^"]*)";', text)
          if product != ["Theresian's Quest"]:
              raise SystemExit(f"Unexpected productName: {product}")
          # Godot derives PRODUCT_NAME from the temporary export basename.
          # Keep it unchanged for Xcode product paths; the Home Screen label is
          # controlled by CFBundleDisplayName below.
          expected_product_name = export_root.name
          if not products or any(value != expected_product_name for value in products):
              raise SystemExit(
                  f"Unexpected PRODUCT_NAME values: {products}; "
                  f"expected generated product basename {expected_product_name!r}"
              )
          if not displays or any(value != "Theresian's Quest" for value in displays):
              raise SystemExit(f"Unexpected display names: {displays}")

          bundle_ids = re.findall(r'(?m)^\s*PRODUCT_BUNDLE_IDENTIFIER\s*=\s*"?([^";]+)"?;', text)
          if not bundle_ids or any(value != expected_bundle for value in bundle_ids):
              raise SystemExit(f"Unexpected Xcode bundle identifiers: {bundle_ids}")
          architectures = re.findall(r'(?m)^\s*ARCHS\s*=\s*"?([^";]+)"?;', text)
          if not architectures or any(value.strip() != "arm64" for value in architectures):
              raise SystemExit(f"Unexpected Xcode architectures: {architectures}")
          minimum_versions = re.findall(r'(?m)^\s*IPHONEOS_DEPLOYMENT_TARGET\s*=\s*"?([0-9.]+)"?;', text)
          def version_tuple(value):
              if not re.fullmatch(r"[0-9]+(?:\.[0-9]+){1,2}", value):
                  raise SystemExit(f"Invalid iOS deployment target: {value!r}")
              return tuple(int(part) for part in value.split("."))
          if not minimum_versions or any(version_tuple(value) < version_tuple(expected_minimum_ios) for value in minimum_versions):
              raise SystemExit(f"Xcode deployment targets must be at least {expected_minimum_ios}: {minimum_versions}")
          device_families = {
              value.strip().strip('"')
              for value in re.findall(r'(?m)^\s*TARGETED_DEVICE_FAMILY\s*=\s*([^;]+);', text)
          }
          if device_families != {"1,2"}:
              raise SystemExit(f"Expected universal iPhone/iPad family settings, found {sorted(device_families)}")
          if "ASSETCATALOG_COMPILER_APPICON_NAME = AppIcon;" not in text:
              raise SystemExit("The generated Xcode target does not compile the AppIcon asset catalog.")

          icon_roots = [export_root]
          icon_roots.extend(
              child for child in xcode_project.parent.iterdir()
              if child.is_dir() and child != xcode_project
          )
          icon_manifests = sorted({
              (root / "Images.xcassets" / "AppIcon.appiconset" / "Contents.json").resolve()
              for root in icon_roots
              if (root / "Images.xcassets" / "AppIcon.appiconset" / "Contents.json").is_file()
          })
          if len(icon_manifests) != 1:
              raise SystemExit(f"Expected one generated AppIcon asset catalog, found {len(icon_manifests)}.")
          icon_manifest = icon_manifests[0]
          icon_data = json.loads(icon_manifest.read_text(encoding="utf-8"))
          icon_entries = [
              image for image in icon_data.get("images", [])
              if image.get("size") == "1024x1024"
              and image.get("idiom") == "universal"
              and image.get("platform", "ios") == "ios"
              and image.get("filename")
          ]
          if len(icon_entries) != 1:
              raise SystemExit("The generated AppIcon catalog must name one universal 1024x1024 App Store icon.")
          icon_path = icon_manifest.parent / icon_entries[0]["filename"]
          if not icon_path.is_file():
              raise SystemExit(f"The generated App Store icon is missing: {icon_path}")
          icon_bytes = icon_path.read_bytes()
          if icon_bytes[:8] != b"\x89PNG\r\n\x1a\n" or len(icon_bytes) < 33:
              raise SystemExit("The generated App Store icon is not a valid PNG.")
          width, height = struct.unpack(">II", icon_bytes[16:24])
          if (width, height) != (1024, 1024):
              raise SystemExit(f"The App Store icon must be 1024x1024; found {width}x{height}.")
          color_type = icon_bytes[25]
          has_alpha = color_type in (4, 6)
          offset = 8
          while offset + 12 <= len(icon_bytes):
              chunk_length = struct.unpack(">I", icon_bytes[offset:offset + 4])[0]
              chunk_type = icon_bytes[offset + 4:offset + 8]
              if chunk_type == b"tRNS":
                  has_alpha = True
              offset += 12 + chunk_length
              if chunk_type == b"IEND":
                  break
          if has_alpha:
              raise SystemExit("The generated App Store icon has alpha transparency.")
          print(f"Verified universal 1024x1024 App Store icon: {icon_path}")

          if "Theresian&apos;s Quest" in text:
              raise SystemExit("An escaped Theresian's Quest name remains in the generated Xcode project.")
          pbx.write_text(text, encoding="utf-8")
          (work_root / "xcode-resource-corrections.txt").write_text(
              f"xcode_project={xcode_project}\n"
              f"pck={data_pck}\n"
              f"pck_reference={os.path.relpath(data_pck, base)}\n"
              f"privacy_manifest={privacy}\n"
              f"privacy_reference={os.path.relpath(privacy, base)}\n"
              f"minimum_ios_version={expected_minimum_ios}\n"
              f"escaped_name_lines_corrected={corrected}\n",
              encoding="utf-8",
          )
          PY

      - name: Verify generated Xcode scheme and configurations
        shell: bash
        run: |
          set -euo pipefail
          project_list="$RUNNER_TEMP/theresians-quest-xcode-project-list.json"
          xcodebuild -project "$XCODE_PROJECT" -list -json > "$project_list"
          scheme="$(python3 - "$project_list" <<'PY'
          import json
          import sys
          from pathlib import Path

          data = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          project = data.get("project", {})
          schemes = project.get("schemes", [])
          configurations = set(project.get("configurations", []))
          targets = project.get("targets", [])
          if len(schemes) != 1:
              raise SystemExit(f"Expected one generated Xcode scheme, found {schemes}")
          if not {"Debug", "Release"}.issubset(configurations):
              raise SystemExit(f"Generated Xcode project lacks Debug/Release configurations: {sorted(configurations)}")
          if len(targets) != 1:
              raise SystemExit(f"Expected one generated iOS app target, found {targets}")
          print(schemes[0])
          PY
          )"
          if [[ -z "$scheme" ]]; then
            echo "The generated Xcode project has no usable scheme." >&2
            exit 1
          fi
          echo "IOS_XCODE_SCHEME=$scheme" >> "$GITHUB_ENV"
          echo "Verified generated Xcode scheme: $scheme (archive command explicitly selects Release)."

      - name: Validate Apple signing inputs and archive/export IPA
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' && inputs.build_signed == true }}
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          IOS_PROVISIONING_PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          for variable_name in IOS_DISTRIBUTION_CERTIFICATE_BASE64 IOS_DISTRIBUTION_CERTIFICATE_PASSWORD IOS_PROVISIONING_PROFILE_BASE64 IOS_PROVISIONING_PROFILE_NAME IOS_KEYCHAIN_PASSWORD; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "Required Apple signing input is missing: $variable_name" >&2
              exit 1
            fi
          done
          keychain_path="$RUNNER_TEMP/theresians-quest-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/apple-distribution.p12"
          profile_path="$RUNNER_TEMP/appstore.mobileprovision"
          profile_plist="$RUNNER_TEMP/appstore-profile.plist"
          archive_path="$RUNNER_TEMP/theresians-quest.xcarchive"
          export_dir="$RUNNER_TEMP/theresians-quest-ipa"
          if ! printf "%s" "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"; then
            echo "IOS_DISTRIBUTION_CERTIFICATE_BASE64 is not valid base64." >&2
            exit 1
          fi
          if ! printf "%s" "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$profile_path"; then
            echo "IOS_PROVISIONING_PROFILE_BASE64 is not valid base64." >&2
            exit 1
          fi
          if [[ ! -s "$certificate_path" ]]; then
            echo "The decoded Apple Distribution certificate file is empty." >&2
            exit 1
          fi
          if [[ ! -s "$profile_path" ]]; then
            echo "The decoded App Store provisioning profile is empty." >&2
            exit 1
          fi
          chmod 600 "$certificate_path" "$profile_path"
          if ! security cms -D -i "$profile_path" > "$profile_plist"; then
            echo "The provisioning profile could not be decoded as a signed Apple profile." >&2
            exit 1
          fi
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print:UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print:Name' "$profile_plist")"
          if [[ ! "$profile_uuid" =~ ^[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}$ || "$profile_name" == *$'\n'* ]]; then
            echo "The provisioning profile UUID or name has an invalid format." >&2
            exit 1
          fi
          if [[ "$profile_name" != "$IOS_PROVISIONING_PROFILE_NAME" ]]; then
            echo "IOS_PROVISIONING_PROFILE_NAME does not match the decoded profile name." >&2
            exit 1
          fi
          python3 - "$profile_plist" "$IOS_BUNDLE_ID" "$IOS_TEAM_ID" <<PY_PROFILE
          import plistlib
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          profile_path, expected_bundle, expected_team = sys.argv[1:]
          with Path(profile_path).open("rb") as stream:
              profile = plistlib.load(stream)

          if expected_team not in profile.get("TeamIdentifier", []):
              raise SystemExit("The provisioning profile TeamIdentifier does not match IOS_TEAM_ID.")
          platforms = profile.get("Platform", [])
          if platforms and "iOS" not in platforms:
              raise SystemExit("The provisioning profile is not an iOS profile.")
          expiration = profile.get("ExpirationDate")
          if not isinstance(expiration, datetime):
              raise SystemExit("The provisioning profile has no valid ExpirationDate.")
          if expiration.tzinfo is None:
              expiration = expiration.replace(tzinfo=timezone.utc)
          if expiration <= datetime.now(timezone.utc):
              raise SystemExit("The provisioning profile is expired.")
          entitlements = profile.get("Entitlements", {})
          app_id = entitlements.get("application-identifier", "")
          suffix = "." + expected_bundle
          if not isinstance(app_id, str) or not app_id.endswith(suffix) or "*" in app_id:
              raise SystemExit("The provisioning profile application-identifier does not exactly match IOS_BUNDLE_ID.")
          prefix = app_id[:-len(suffix)]
          if prefix not in profile.get("ApplicationIdentifierPrefix", []):
              raise SystemExit("The provisioning profile application identifier has an unknown App ID prefix.")
          if entitlements.get("get-task-allow") is not False:
              raise SystemExit("The provisioning profile must be a distribution profile with get-task-allow=false.")
          if "ProvisionedDevices" in profile or profile.get("ProvisionsAllDevices") is True:
              raise SystemExit("The provisioning profile is not an App Store distribution profile.")
          print(f"App Store profile preflight passed for {expected_bundle} and Team ID {expected_team}; expires {expiration.date()}.")
          PY_PROFILE
          profile_install_dir="$HOME/Library/MobileDevice/Provisioning Profiles"
          profile_install_path="$profile_install_dir/$profile_uuid.mobileprovision"
          mkdir -p "$profile_install_dir"
          if [[ -e "$profile_install_path" ]]; then
            echo "The provisioning-profile UUID is already installed on this runner; refusing to overwrite it." >&2
            exit 1
          fi
          echo "IOS_PROFILE_UUID=$profile_uuid" >> "$GITHUB_ENV"
          echo "IOS_PROFILE_NAME=$profile_name" >> "$GITHUB_ENV"
          cp "$profile_path" "$profile_install_path"
          keychain_marker="$RUNNER_TEMP/theresians-quest-keychain-owned"
          if [[ -e "$keychain_path" || -e "$keychain_marker" ]]; then
            echo "The temporary signing-keychain path is already in use; refusing to reuse it." >&2
            exit 1
          fi
          if ! security create-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain_path"; then
            echo "Could not create the temporary signing keychain." >&2
            exit 1
          fi
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$keychain_marker"
          echo "IOS_TEMP_KEYCHAIN_PATH=$keychain_path" >> "$GITHUB_ENV"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$IOS_KEYCHAIN_PASSWORD" "$keychain_path"
          if ! security import "$certificate_path" -k "$keychain_path" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security >/dev/null 2>&1; then
            echo "Could not import the Apple Distribution certificate; verify its password and PKCS#12 contents." >&2
            exit 1
          fi
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          security default-keychain -s "$keychain_path"
          security set-key-partition-list -S apple-tool:,apple: -k "$IOS_KEYCHAIN_PASSWORD" "$keychain_path" >/dev/null
          identities="$(security find-identity -v -p codesigning "$keychain_path" 2>/dev/null || true)"
          identity_hash="$(python3 - "$profile_plist" "$identities" "$IOS_TEAM_ID" <<'PY_IDENTITY'
          import hashlib
          import plistlib
          import re
          import sys
          from pathlib import Path

          profile_path, identity_output, expected_team = sys.argv[1:]
          identity_pattern = re.compile(
              r'^\s*(?:\d+\)\s*)?([A-Fa-f0-9]{40})\s+"Apple Distribution: .*?\('
              + re.escape(expected_team) + r'\)"\s*$',
              re.MULTILINE,
          )
          identities = {value.upper() for value in identity_pattern.findall(identity_output)}
          if not identities:
              raise SystemExit("No valid Apple Distribution identity with a private key matches IOS_TEAM_ID.")
          with Path(profile_path).open("rb") as stream:
              profile = plistlib.load(stream)
          certificates = profile.get("DeveloperCertificates", [])
          if not certificates:
              raise SystemExit("The provisioning profile contains no signing certificates.")
          profile_fingerprints = {
              hashlib.sha1(certificate).hexdigest().upper()
              for certificate in certificates
              if isinstance(certificate, bytes)
          }
          matches = sorted(identities & profile_fingerprints)
          if not matches:
              raise SystemExit("The App Store profile does not contain the imported Apple Distribution certificate.")
          print(matches[0])
          PY_IDENTITY
          )"
          if [[ ! "$identity_hash" =~ ^[A-Fa-f0-9]{40}$ ]]; then
            echo "Could not select an Apple Distribution certificate matching the provisioning profile." >&2
            exit 1
          fi
          scheme="$IOS_XCODE_SCHEME"
          if [[ -z "$scheme" ]]; then
            echo "The generated Xcode scheme was not recorded during preflight." >&2
            exit 1
          fi
          link_map="$RUNNER_TEMP/theresians-quest-ios-engine-link-map.txt"
          xcodebuild \
            -project "$XCODE_PROJECT" \
            -scheme "$scheme" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$archive_path" \
            DEVELOPMENT_TEAM="$IOS_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$identity_hash" \
            PROVISIONING_PROFILE_SPECIFIER="$profile_name" \
            LD_GENERATE_MAP_FILE=YES \
            "LD_MAP_FILE_PATH=$link_map" \
            archive
          test -s "$link_map"
          grep -F 'libgodot.a(' "$link_map" >/dev/null
          grep -E 'ios\.template_release\.arm64' "$link_map" >/dev/null
          if grep -E 'ios\.template_debug\.arm64' "$link_map" >/dev/null; then
            echo "The signed Release link map contains debug Godot engine objects." >&2
            exit 1
          fi
          python3 - "$RUNNER_TEMP/ExportOptions.plist" "$IOS_BUNDLE_ID" "$IOS_TEAM_ID" "$profile_name" "$identity_hash" <<'PY'
          import plistlib
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          bundle_id, team_id, profile_name, identity_hash = sys.argv[2:]
          data = {
              "method": "app-store-connect",
              "signingStyle": "manual",
              "signingCertificate": identity_hash,
              "teamID": team_id,
              "provisioningProfiles": {bundle_id: profile_name},
              "manageAppVersionAndBuildNumber": False,
          }
          path.write_bytes(plistlib.dumps(data, fmt=plistlib.FMT_XML))
          PY
          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$export_dir"
          ipa_path="$(find "$export_dir" -maxdepth 1 -type f -name '*.ipa' -print -quit)"
          test -s "$ipa_path"
          echo "IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Verify IPA metadata, architecture, signature, and checksum
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' && inputs.build_signed == true }}
        shell: bash
        run: |
          set -euo pipefail
          unpacked="$RUNNER_TEMP/theresians-quest-ipa-unpacked"
          unzip -tq "$IPA_PATH"
          rm -rf "$unpacked"
          mkdir -p "$unpacked"
          ditto -x -k "$IPA_PATH" "$unpacked"
          app_count="$(find "$unpacked/Payload" -maxdepth 1 -type d -name '*.app' -print | wc -l | tr -d '[:space:]')"
          [[ "$app_count" == "1" ]]
          app_path="$(find "$unpacked/Payload" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$app_path"
          test -s "$app_path/Assets.car"
          plist="$app_path/Info.plist"
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print:CFBundleIdentifier' "$plist")"
          short_version="$(/usr/libexec/PlistBuddy -c 'Print:CFBundleShortVersionString' "$plist")"
          build_number="$(/usr/libexec/PlistBuddy -c 'Print:CFBundleVersion' "$plist")"
          [[ "$bundle_id" == "$IOS_BUNDLE_ID" ]]
          [[ "$short_version" == "$IOS_MARKETING_VERSION" ]]
          [[ "$build_number" == "$IOS_BUILD_NUMBER" ]]
          python3 - "$plist" "$IOS_MIN_IOS_VERSION" <<'PY_APP_PLIST'
          import plistlib
          import sys
          from pathlib import Path

          plist_path, expected_minimum = sys.argv[1:]
          with Path(plist_path).open("rb") as stream:
              app = plistlib.load(stream)

          def version_tuple(value):
              if not isinstance(value, str):
                  raise SystemExit("Built app has no string MinimumOSVersion.")
              try:
                  return tuple(int(part) for part in value.split("."))
              except ValueError as error:
                  raise SystemExit(f"Built app has invalid MinimumOSVersion: {value!r}") from error

          actual_minimum = app.get("MinimumOSVersion")
          if version_tuple(actual_minimum) < version_tuple(expected_minimum):
              raise SystemExit(
                  f"Built app MinimumOSVersion {actual_minimum} is below the required "
                  f"{expected_minimum} for Xcode 26.3 uploads."
              )
          if app.get("CFBundleDisplayName") != "Theresian's Quest":
              raise SystemExit(f"Unexpected CFBundleDisplayName: {app.get('CFBundleDisplayName')!r}")
          if app.get("UIDeviceFamily") != [1, 2]:
              raise SystemExit(f"Expected universal iPhone/iPad device family, got {app.get('UIDeviceFamily')!r}")
          print(f"Built app display name and minimum iOS {actual_minimum} verified.")
          PY_APP_PLIST
          executable="$(/usr/libexec/PlistBuddy -c 'Print:CFBundleExecutable' "$plist")"
          test -x "$app_path/$executable"
          app_archs="$(lipo -archs "$app_path/$executable")"
          [[ "$app_archs" == "arm64" ]]
          echo "App executable architectures: $app_archs"
          codesign --verify --deep --strict --verbose=2 "$app_path"
          signing_report="$RUNNER_TEMP/theresians-quest-signing-report.txt"
          codesign -dvvv "$app_path" > "$signing_report" 2>&1 || true
          grep -q 'Authority=Apple Distribution' "$signing_report"
          grep -q "TeamIdentifier=$IOS_TEAM_ID" "$signing_report"
          entitlements_path="$RUNNER_TEMP/theresians-quest-ipa-entitlements.plist"
          if ! codesign -d --entitlements :- "$app_path" > "$entitlements_path" 2>"$RUNNER_TEMP/codesign-entitlements.log"; then
            echo "Could not extract signed app entitlements for verification." >&2
            exit 1
          fi
          embedded_profile="$app_path/embedded.mobileprovision"
          test -s "$embedded_profile"
          embedded_profile_plist="$RUNNER_TEMP/theresians-quest-embedded-profile.plist"
          security cms -D -i "$embedded_profile" > "$embedded_profile_plist"
          python3 - "$entitlements_path" "$embedded_profile_plist" "$IOS_BUNDLE_ID" "$IOS_TEAM_ID" "$IOS_PROFILE_UUID" "$IOS_PROFILE_NAME" <<'PY_SIGNED_PROFILE'
          import plistlib
          import sys
          from datetime import datetime, timezone
          from pathlib import Path

          entitlements_path, profile_path, expected_bundle, expected_team, expected_uuid, expected_name = sys.argv[1:]
          with Path(entitlements_path).open("rb") as stream:
              signed = plistlib.load(stream)
          with Path(profile_path).open("rb") as stream:
              profile = plistlib.load(stream)

          profile_entitlements = profile.get("Entitlements", {})
          signed_app_id = signed.get("application-identifier")
          profile_app_id = profile_entitlements.get("application-identifier")
          suffix = "." + expected_bundle
          if not isinstance(signed_app_id, str) or not signed_app_id.endswith(suffix) or "*" in signed_app_id:
              raise SystemExit("Signed app application-identifier does not exactly match IOS_BUNDLE_ID.")
          if signed_app_id != profile_app_id:
              raise SystemExit("Signed app application-identifier differs from the embedded provisioning profile.")
          if expected_team not in profile.get("TeamIdentifier", []):
              raise SystemExit("Embedded provisioning profile TeamIdentifier does not match IOS_TEAM_ID.")
          if signed.get("com.apple.developer.team-identifier") != expected_team:
              raise SystemExit("Signed app team entitlement does not match IOS_TEAM_ID.")
          prefix = signed_app_id.split(".", 1)[0]
          if prefix not in profile.get("ApplicationIdentifierPrefix", []):
              raise SystemExit("Embedded profile does not authorize the signed app identifier prefix.")
          if signed.get("get-task-allow") is not False or profile_entitlements.get("get-task-allow") is not False:
              raise SystemExit("Signed app and profile must both set get-task-allow=false.")
          if profile.get("UUID") != expected_uuid or profile.get("Name") != expected_name:
              raise SystemExit("Embedded provisioning profile does not match the validated profile UUID/name.")
          expiration = profile.get("ExpirationDate")
          if not isinstance(expiration, datetime):
              raise SystemExit("Embedded provisioning profile has no valid expiration date.")
          if expiration.tzinfo is None:
              expiration = expiration.replace(tzinfo=timezone.utc)
          if expiration <= datetime.now(timezone.utc):
              raise SystemExit("Embedded provisioning profile is expired.")
          if "ProvisionedDevices" in profile or profile.get("ProvisionsAllDevices") is True:
              raise SystemExit("Embedded profile is not an App Store distribution profile.")
          print(f"Signed app entitlements and embedded App Store profile verified for {expected_bundle}.")
          PY_SIGNED_PROFILE
          pck_source="${IOS_DATA_PCK:?Verified exported PCK path was not recorded during export}"
          test -s "$pck_source"
          app_pck="$(find "$app_path" -type f -name '*.pck' -print -quit)"
          test -s "$app_pck"
          app_pck_count="$(find "$app_path" -type f -name '*.pck' -print | wc -l | tr -d '[:space:]')"
          [[ "$app_pck_count" == "1" ]]
          cmp -s "$pck_source" "$app_pck"
          privacy_source="$CI_PROJECT/PrivacyInfo.xcprivacy"
          privacy_in_app="$app_path/PrivacyInfo.xcprivacy"
          test -s "$privacy_source"
          test -s "$privacy_in_app"
          plutil -lint "$privacy_in_app"
          cmp -s "$privacy_source" "$privacy_in_app"
          sha256="$(shasum -a 256 "$IPA_PATH" | awk '{print toupper($1)}')"
          size_bytes="$(stat -f '%z' "$IPA_PATH")"
          report="$ARTIFACT_DIR/ios-build-report.txt"
          {
            echo "source_commit=$GITHUB_SHA"
            echo "godot_version=$GODOT_VERSION"
            echo "export_preset=$IOS_PRESET"
            echo "backend=https://theresiansquest.com"
            echo "bundle_id=$bundle_id"
            echo "team_id=$IOS_TEAM_ID"
            echo "marketing_version=$short_version"
            echo "build_number=$build_number"
            echo "architecture=arm64"
            echo "minimum_ios_version=$IOS_MIN_IOS_VERSION"
            echo "display_name=Theresian's Quest"
            echo "signing=Apple Distribution"
            echo "ipa_file=$(basename "$IPA_PATH")"
            echo "ipa_size_bytes=$size_bytes"
            echo "sha256=$sha256"
          } > "$report"
          {
            echo "## iOS build"
            echo "- Source commit: `$GITHUB_SHA`"
            echo "- Backend: `https://theresiansquest.com`"
            echo "- Godot: `$GODOT_VERSION`"
            echo "- Preset: `$IOS_PRESET`"
            echo "- Bundle ID: `$bundle_id`"
            echo "- Version: `$short_version ($build_number)`"
            echo "- Architecture: `arm64`"
            echo "- Signing: Apple Distribution"
            echo "- IPA size: `$size_bytes bytes`"
            echo "- SHA-256: `$sha256`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified IPA artifact
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' && inputs.build_signed == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TheresiansQuest-iOS-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            ${{ runner.temp }}/theresians-quest-ipa/*.ipa
            ${{ runner.temp }}/theresians-quest-ios-artifact/ios-build-report.txt

      - name: Upload verified IPA to App Store Connect for TestFlight processing
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' && inputs.build_signed == true && vars.IOS_TESTFLIGHT_UPLOAD_ENABLED == 'true' && inputs.upload_testflight == true && github.run_attempt == 1 }}
        shell: bash
        env:
          APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
          APPSTORE_API_PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          for variable_name in APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_API_PRIVATE_KEY; do
            if [[ -z "${!variable_name:-}" ]]; then
              echo "TestFlight upload is enabled but this input is missing: $variable_name" >&2
              exit 1
            fi
          done
          if [[ ! "$APPSTORE_KEY_ID" =~ ^[A-Z0-9]{10}$ ]]; then
            echo "APPSTORE_KEY_ID must be the 10-character uppercase alphanumeric key ID from App Store Connect." >&2
            exit 1
          fi
          if [[ ! "$APPSTORE_ISSUER_ID" =~ ^[A-Fa-f0-9]{8}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{4}-[A-Fa-f0-9]{12}$ ]]; then
            echo "APPSTORE_ISSUER_ID must be a UUID from App Store Connect." >&2
            exit 1
          fi
          umask 077
          asc_home="$RUNNER_TEMP/theresians-quest-appstore-home-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ -e "$asc_home" ]]; then
            echo "The run-specific App Store Connect key directory already exists; refusing to reuse it." >&2
            exit 1
          fi
          key_dir="$asc_home/.appstoreconnect/private_keys"
          mkdir -p "$key_dir"
          printf '%s\n' "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" > "$asc_home/.workflow-owned-temp"
          echo "APPSTORE_TEMP_HOME=$asc_home" >> "$GITHUB_ENV"
          key_path="$key_dir/AuthKey_${APPSTORE_KEY_ID}.p8"
          if [[ -e "$key_path" ]]; then
            echo "An App Store Connect key file already exists at the expected temporary path; refusing to overwrite it." >&2
            exit 1
          fi
          printf '%s' "$APPSTORE_API_PRIVATE_KEY" > "$key_path"
          chmod 600 "$key_path"
          trap 'rm -f "$key_path"' EXIT
          if ! openssl pkey -in "$key_path" -noout >/dev/null 2>&1; then
            echo "APPSTORE_API_PRIVATE_KEY is not a valid PEM private key." >&2
            exit 1
          fi
          if ! HOME="$asc_home" xcrun altool --upload-app --type ios --file "$IPA_PATH" --apiKey "$APPSTORE_KEY_ID" --apiIssuer "$APPSTORE_ISSUER_ID"; then
            echo "App Store Connect rejected the IPA upload request; review the preceding altool error." >&2
            exit 1
          fi
          echo "App Store Connect accepted the IPA upload request. Processing is asynchronous; internal tester-group assignment remains an App Store Connect step." >> "$GITHUB_STEP_SUMMARY"

      - name: Explain skipped TestFlight upload
        if: ${{ vars.IOS_SIGNING_ENABLED == 'true' && inputs.build_signed == true && (vars.IOS_TESTFLIGHT_UPLOAD_ENABLED != 'true' || inputs.upload_testflight != true) }}
        shell: bash
        run: |
          echo "IPA artifact was verified and uploaded to GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
          echo "TestFlight upload skipped: enable IOS_TESTFLIGHT_UPLOAD_ENABLED or use the manual workflow input after Apple credentials are configured." >> "$GITHUB_STEP_SUMMARY"

      - name: Explain skipped signed IPA build
        if: ${{ vars.IOS_SIGNING_ENABLED != 'true' || inputs.build_signed != true }}
        shell: bash
        run: |
          echo "Unsigned iOS project export completed." >> "$GITHUB_STEP_SUMMARY"
          echo "Signed IPA/archive skipped: set IOS_SIGNING_ENABLED=true only after Apple signing secrets are configured, or use workflow_dispatch with build_signed enabled." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary Apple signing materials
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/theresians-quest-signing.keychain-db"
          keychain_marker="$RUNNER_TEMP/theresians-quest-keychain-owned"
          if [[ "${IOS_TEMP_KEYCHAIN_PATH:-}" == "$keychain_path" && -f "$keychain_marker" && "$(cat "$keychain_marker")" == "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" ]]; then
            security default-keychain -s login.keychain-db >/dev/null 2>&1 || true
            security list-keychains -d user -s login.keychain-db >/dev/null 2>&1 || true
            if security delete-keychain "$keychain_path" >/dev/null 2>&1; then
              rm -f "$keychain_marker"
            else
              echo "Warning: temporary keychain cleanup did not complete; ownership marker was retained." >&2
            fi
          fi
          if [[ "${IOS_PROFILE_UUID:-}" =~ ^[A-Fa-f0-9-]{36}$ ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi
          rm -f \
            "$RUNNER_TEMP/apple-distribution.p12" \
            "$RUNNER_TEMP/appstore.mobileprovision" \
            "$RUNNER_TEMP/appstore-profile.plist" \
            "$RUNNER_TEMP/ExportOptions.plist" \
            "$RUNNER_TEMP/theresians-quest-ipa-entitlements.plist" \
            "$RUNNER_TEMP/codesign-entitlements.log"
          expected_asc_home="$RUNNER_TEMP/theresians-quest-appstore-home-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "${APPSTORE_TEMP_HOME:-}" == "$expected_asc_home" && -f "$expected_asc_home/.workflow-owned-temp" ]]; then
            if [[ "$(cat "$expected_asc_home/.workflow-owned-temp")" == "$GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" ]]; then
              rm -rf "$expected_asc_home"
            else
              echo "Warning: temporary App Store Connect home ownership marker did not match; leaving the directory untouched." >&2
            fi
          fi
