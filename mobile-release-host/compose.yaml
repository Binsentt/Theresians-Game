services:
  ota-host:
    build: .
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    environment:
      OTA_PUBLIC_BASE_URL: ${OTA_PUBLIC_BASE_URL:?Set OTA_PUBLIC_BASE_URL}
      OTA_BUNDLE_ID: com.theresiansquest.game
      OTA_INSTALL_PASSWORD_FILE: /run/secrets/ota_install_password
      OTA_UPLOAD_TOKEN_FILE: /run/secrets/ota_upload_token
      OTA_CAPABILITY_SECRET_FILE: /run/secrets/ota_capability_secret
      OTA_STORAGE_DIR: /data
      OTA_SESSION_SECONDS: "3600"
      OTA_CAPABILITY_SECONDS: "21600"
    secrets:
      - ota_install_password
      - ota_upload_token
      - ota_capability_secret
    volumes:
      - ota-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks: [private]

  https-proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      OTA_DOMAIN: ${OTA_DOMAIN:?Set OTA_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      ota-host:
        condition: service_healthy
    networks: [private]

secrets:
  ota_install_password:
    file: ./secrets/ota_install_password
  ota_upload_token:
    file: ./secrets/ota_upload_token
  ota_capability_secret:
    file: ./secrets/ota_capability_secret

volumes:
  ota-data:
  caddy-data:
  caddy-config:

networks:
  private:
